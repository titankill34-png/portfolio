<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060B14">
<title>Sittichok kakandee</title>
<style>
  :root {
    color-scheme: dark;
    --text-heading: #F2F6FF;
    --text-body: rgba(226, 235, 250, 0.80);
    --text-secondary: rgba(226, 235, 250, 0.48);
    --accent: #60A5FA;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #060B14;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(37, 99, 235, 0.28), transparent 60%),
      radial-gradient(ellipse at 85% 100%, rgba(96, 165, 250, 0.16), transparent 55%);
    color: var(--text-body);
    font-family: system-ui, sans-serif;
    line-height: 1.6;
  }
  .page {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: rgba(255, 255, 255, 0.055);
    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.11);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.09);
    padding: 24px;
  }
  .card--hero {
    padding: 16px;
  }

  .badge {
    margin: 0 0 12px;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 4px;
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-heading);
    white-space: nowrap;
  }
  .tagline {
    margin: 0;
    font-size: 15px;
    color: var(--text-secondary);
  }

  .work-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    transition: border-color 200ms ease, transform 200ms ease;
  }
  .work-card:hover {
    border-color: rgba(96, 165, 250, 0.42);
    transform: translateY(-2px);
  }
  .work-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .work-num {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .work-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-heading);
  }
  .work-desc {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .work-arrow {
    flex-shrink: 0;
    color: var(--accent);
    font-size: 18px;
  }

  .section-label {
    margin: 0 0 14px;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--text-secondary);
  }
  .qr-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .qr-box {
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .qr-white {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 12px;
  }
  .qr-white img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    display: block;
  }
  .qr-label {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    text-align: center;
    color: var(--text-secondary);
  }
  .github-link {
    display: block;
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-body);
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    padding-bottom: 2px;
    width: fit-content;
  }
  .github-link:hover {
    border-bottom-color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="page">
  <div class="card card--hero">
    <p class="badge">PORTFOLIO</p>
    <h1>Sittichok kakandee</h1>
    <p class="tagline">ออกแบบงานนำเสนอ และสร้างระบบอัตโนมัติด้วย AI</p>
  </div>

  <a class="card work-card" href="projects/medi-band-dm/animated-presentation/">
    <div class="work-body">
      <span class="work-num">01</span>
      <span class="work-title">Medi-band DM — งานนำเสนอ</span>
      <span class="work-desc">งานนำเสนอแอนิเมชัน 15 สไลด์</span>
    </div>
    <span class="work-arrow">&rarr;</span>
  </a>

  <a class="card work-card" href="case-taskwatch.html">
    <div class="work-body">
      <span class="work-num">02</span>
      <span class="work-title">สร้างระบบ AI ที่ส่งงานได้จากมือถือ</span>
      <span class="work-desc">ระบบ AI ที่ทำงานเองบนมือถือ</span>
    </div>
    <span class="work-arrow">&rarr;</span>
  </a>

  <div class="card">
    <p class="section-label">CONTACT</p>
    <div class="qr-grid">
      <a class="qr-box" href="https://www.instagram.com/taxx.exe_">
        <div class="qr-white">
          <img src="assets/qr-instagram.png" alt="คิวอาร์โค้ดสำหรับติดตาม Instagram">
        </div>
        <span class="qr-label">Instagram</span>
      </a>
      <a class="qr-box" href="https://line.me/ti/p/_257NKsXpE">
        <div class="qr-white">
          <img src="assets/qr-line.jpg" alt="คิวอาร์โค้ดสำหรับแอด LINE">
        </div>
        <span class="qr-label">LINE</span>
      </a>
    </div>
    <a class="github-link" href="https://github.com/titankill34-png">GitHub</a>
  </div>
</div>
</body>
</html>
